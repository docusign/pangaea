<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Good Globalization - Test Page</title>
    <style>
      body {
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
        max-width: 800px;
        margin: 0 auto;
        padding: 20px;
      }

      .container {
        margin-block: 20px;
        padding-inline: 20px;
        border: 1px solid #ccc;
        border-radius: 8px;
      }

      .button {
        padding: 10px 20px;
        margin-inline-end: 10px;
        background: #007bff;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        min-inline-size: fit-content;
      }

      .sidebar {
        inline-size: 250px;
        padding: 15px;
        background: #f5f5f5;
        border-radius: 4px;
      }
    </style>
  </head>
  <body>
    <h1>Good Globalization Example</h1>

    <div class="container">
      <h2>Welcome to our application</h2>
      <p>This page uses logical CSS properties and follows globalization best practices.</p>

      <button class="button">Submit</button>
      <button class="button">Cancel</button>
    </div>

    <div class="sidebar">
      <h3>Navigation</h3>
      <ul>
        <li>Home</li>
        <li>About</li>
        <li>Contact</li>
      </ul>
    </div>
  </body>
</html>
